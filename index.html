                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 主要工作區 */}
          <main className={`flex-1 max-w-7xl mx-auto w-full p-2 sm:p-6 flex flex-col gap-4 sm:gap-6 relative ${appSettings.layoutReversed ? 'lg:flex-row-reverse' : 'lg:flex-row'}`}>
            {/* 素材區 */}
            <section className="w-full lg:w-72 flex-shrink-0 flex flex-col gap-3 relative font-sans">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <div className="flex justify-between items-center mb-3">
                  <h2 className="font-black text-gray-800 text-lg">📝 素材區 ({unassignedItems.length})</h2>
                  <div className="flex gap-1.5">
                    {appSettings.isMultiSelectMode && unassignedItems.length > 0 && (
                      <button onClick={() => setSelectedIds(unassignedItems.map(i => i.id))} className="p-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-md transition-colors" title="全選素材區"><CheckSquare size={16}/></button>
                    )}
                    <button onClick={() => {
                      setItems(prev => {
                        const matItems = prev.filter(i => i.levelId === null).sort((a,b) => a.text.localeCompare(b.text, 'zh-Hant'));
                        const levelItems = prev.filter(i => i.levelId !== null);
                        return [...levelItems, ...matItems];
                      });
                      showToast("🔤 素材區已排序！");
                    }} className="p-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md transition-colors" title="依照名稱排序素材"><ArrowDownAZ size={16}/></button>
                    <label className="relative p-1.5 bg-green-100 hover:bg-green-200 text-green-700 rounded-md transition-colors cursor-pointer" title="大量匯入圖片建立卡片">
                      <Images size={16}/> <input type="file" multiple accept="image/*" onChange={handleBatchImport} className="hidden" />
                      {importProgress > 0 && <div className="absolute -bottom-2 left-0 right-0 h-1.5 bg-green-200 rounded overflow-hidden"><div className="h-full bg-green-600 transition-all" style={{width: `${importProgress}%`}}></div></div>}
                    </label>
                    <button onClick={() => setInputDialog({ isOpen: true, type: 'saveMaterialPack', itemId: '', value: '', options: {} })} className="p-1.5 bg-yellow-100 hover:bg-yellow-200 text-yellow-700 rounded-md transition-colors" title="儲存為素材包"><Save size={16}/></button>
                    <button onClick={() => setShowMaterialsModal(true)} className="p-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-md transition-colors" title="管理素材包"><FolderOpen size={16}/></button>
                  </div>
                </div>
                
                <form onSubmit={addNewItem} className="flex gap-2 mb-4">
                  <input type="text" value={newItemText} onChange={(e) => setNewItemText(e.target.value)} placeholder="輸入新項目..." className="flex-1 bg-gray-100 border border-transparent text-sm font-bold rounded-lg px-3 py-2 focus:bg-white focus:border-indigo-400" />
                  <button type="submit" className="bg-gray-900 text-white px-3 rounded-lg hover:bg-black font-bold"><Plus size={20}/></button>
                </form>
                <div 
                  className={`min-h-[120px] lg:min-h-[400px] p-2 rounded-lg border-2 border-dashed transition-colors flex flex-wrap content-start ${selectedIds.length > 0 ? 'border-indigo-400 bg-indigo-50/50' : 'border-gray-300 bg-gray-50'}`} 
                  onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, null)} onClick={() => selectedIds.length && handleZoneClick(null)}
                >
                  {unassignedItems.length === 0 ? <div className="w-full h-full flex flex-col items-center justify-center text-gray-400 text-sm font-bold p-4 text-center">空空的<br/>可以拖圖進來或打字新增</div> : unassignedItems.map(renderItem)}
                </div>
              </div>
              
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 font-sans">
                 <h3 className="font-bold text-sm text-gray-700 mb-2">列印區背景設定</h3>
                 <div className="flex gap-2 items-center">
                   <input type="color" value={background.startsWith('http') || background.startsWith('url') ? '#1a1a1a' : background} onChange={(e) => setBackground(e.target.value)} className="w-8 h-8 rounded cursor-pointer p-0 border-none"/>
                   <input type="text" value={background} onChange={(e) => setBackground(e.target.value)} placeholder="色碼 或 圖片網址" className="flex-1 bg-gray-100 text-sm p-1.5 rounded border border-transparent focus:bg-white" />
                 </div>
              </div>
            </section>

            {/* 評比表區 */}
            <section className="flex-1 rounded-xl shadow-xl overflow-hidden relative border-4 border-gray-900" style={{ backgroundColor: background.startsWith('http') ? '#1a1a1a' : background }}>
              <div id="tier-board" ref={boardRef} className="p-4 sm:p-6 min-w-full relative" style={{ backgroundColor: background.startsWith('http') ? '#1a1a1a' : background }}>
                
                {/* 解決匯出圖片背景 BUG 的核心層疊技術 */}
                {background.startsWith('http') && (
                  <img src={background} crossOrigin="anonymous" alt="background" className="absolute inset-0 w-full h-full z-0" style={{ objectFit: appSettings.bgSize || 'cover', opacity: 1 - (appSettings.bgOverlay || 0) }} />
                )}

                <div className="relative z-10">
                  <div className="mb-4 text-center app-container relative">
                    <h1 onClick={() => setInputDialog({ isOpen: true, type: 'title', itemId: '', value: title, options: { color: titleColor } })} className="text-3xl sm:text-5xl font-black tracking-tight drop-shadow-md cursor-pointer hover:opacity-80 transition-colors inline-block" style={{ color: titleColor }}>{title}</h1>
                    <br/>
                    <span onClick={() => setInputDialog({ isOpen: true, type: 'axisName', itemId: '', value: axisName, options: { color: axisColor } })} className="inline-block mt-3 px-4 py-1.5 text-sm font-bold rounded-full border border-gray-700 cursor-pointer hover:opacity-80 transition-colors shadow-sm" style={{ color: axisColor, backgroundColor: '#1f2937' }}>{axisName || '+ 新增副標題/軸向'}</span>
                    
                    {/* 動態計算顯示總戰力計分板 */}
                    {appSettings.showScoreboard && totalScore > 0 && (
                      <div className="block mt-4">
                        <div 
                          className="inline-flex items-center gap-2 bg-yellow-500/10 text-yellow-500 px-4 py-1.5 rounded-full border border-yellow-500/30 backdrop-blur-sm mix-blend-difference filter invert cursor-pointer hover:bg-yellow-500/20 transition-colors"
                          onClick={() => setInputDialog({ isOpen: true, type: 'scoreboard', value: appSettings.scoreboardName || '總分/戰力指數', options: { showScoreboard: appSettings.showScoreboard } })}
                        >
                          <span className="font-bold text-sm">{appSettings.scoreboardName || '總分/戰力指數'}</span>
                          <span className="font-black text-xl">{totalScore}</span>
                        </div>
                      </div>
                    )}
                  </div>
                  
                  <div className="flex flex-col border border-black bg-black rounded-lg shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                    {levels.map((level, index) => {
                      const levelItems = items.filter(item => item.levelId === level.id);
                      const isEditing = editingLevelId === level.id;
                      const textColor = level.textColor || getContrastYIQ(level.color, appSettings.contrastThreshold);
                      const labelWidthClass = getLabelWidthClass();

                      return (
                        <div key={level.id} id={`level-${index}`} className={`flex min-h-[90px] bg-[#1a1a1a] border-b border-black last:border-b-0 group/row relative ${isEditing ? 'z-50' : 'z-10'} ${index === 0 ? 'rounded-t-lg' : ''} ${index === levels.length - 1 ? 'rounded-b-lg' : ''}`}>
                          <div className={`${labelWidthClass} flex-shrink-0 flex items-center justify-center p-2 relative border-r border-black transition-colors duration-300 ${index === 0 ? 'rounded-tl-lg' : ''} ${index === levels.length - 1 ? 'rounded-bl-lg' : ''}`} style={{ backgroundColor: level.color }}>
                            {isEditing ? (
                              <div className="absolute top-0 left-0 bg-[#222] p-2 flex flex-col gap-1 z-50 shadow-2xl border border-gray-500 rounded-lg font-sans w-40 sm:w-48 transform -translate-x-2 -translate-y-2">
                                <input autoFocus value={level.label} onChange={(e) => updateLevel(level.id, 'label', e.target.value)} onBlur={(e) => { if(!e.relatedTarget) setEditingLevelId(null); }} onKeyDown={(e) => e.key === 'Enter' && setEditingLevelId(null)} className="w-full text-center font-black text-xs sm:text-sm bg-[#111] text-white border border-gray-600 rounded p-1 mb-1"/>
                                
                                <div className="flex gap-1 w-full overflow-hidden">
                                  <div className="flex-1 flex items-center bg-[#111] rounded p-1 border border-gray-700" title="底色">
                                    <Palette size={10} className="text-gray-400 mx-1 flex-shrink-0" />
                                    <input type="color" value={level.color} onChange={(e) => updateLevel(level.id, 'color', e.target.value)} className="w-4 h-4 p-0 border-none bg-transparent cursor-pointer" />
                                  </div>
                                  <div className="flex-1 flex items-center bg-[#111] rounded p-1 border border-gray-700" title="文字顏色">
                                    <Type size={10} className="text-gray-400 mx-1 flex-shrink-0" />
                                    <input type="color" value={textColor} onChange={(e) => updateLevel(level.id, 'textColor', e.target.value)} className="w-4 h-4 p-0 border-none bg-transparent cursor-pointer" />
                                  </div>
                                  <div className="flex-1 flex items-center bg-[#111] rounded p-1 border border-gray-700" title="每張卡片分數">
                                    <span className="text-gray-400 mx-1 text-[10px] font-bold">PT</span>
                                    <input type="number" value={level.score || 0} onChange={(e) => updateLevel(level.id, 'score', Number(e.target.value))} className="w-8 h-4 p-0 border-none bg-transparent text-white text-xs text-center focus:ring-0" />
                                  </div>
                                </div>

                                <button onPointerDown={(e) => { e.preventDefault(); setConfirmAction({ isOpen: true, type: 'level', id: level.id }); }} className="mt-1 w-full bg-red-900/50 hover:bg-red-600 text-red-200 text-xs py-1 rounded flex justify-center items-center gap-1"><Trash2 size={10} /> 刪除</button>
                              </div>
                            ) : ( 
                              <span className="font-black text-center break-words cursor-pointer w-full flex items-center justify-center leading-tight drop-shadow-sm app-container" style={{ color: textColor }} onClick={() => setEditingLevelId(level.id)} title="點擊編輯名稱與顏色">{level.label}</span> 
                            )}
                            
                            {!isEditing && (
                              <div className="absolute top-1 right-1 opacity-100 sm:opacity-0 group-hover/row:opacity-100 transition-opacity flex flex-col gap-1 z-20 font-sans">
                                <button onClick={() => setEditingLevelId(level.id)} className="bg-black/50 p-1 rounded hover:bg-black text-white" title="設定"><Settings size={12} /></button>
                                <button onClick={() => sortLevelItemsAlphabetically(level.id)} className="bg-black/50 p-1 rounded hover:bg-blue-600 text-white" title="自動依照名稱排序"><ArrowDownAZ size={12} /></button>
                                <button onClick={() => setConfirmAction({ isOpen: true, type: 'level', id: level.id })} className="bg-black/50 p-1 rounded hover:bg-red-600 text-white" title="刪除"><Trash2 size={12} /></button>
                              </div>
                            )}
                          </div>
                          
                          <div className={`flex-1 p-1 sm:p-2 flex flex-wrap content-start gap-1 sm:gap-2 transition-all ${selectedIds.length ? 'bg-indigo-900/40 cursor-pointer shadow-[inset_0_0_0_2px_#6366f1]' : ''}`} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, level.id)} onClick={() => selectedIds.length && handleZoneClick(level.id)}>
                            {levelItems.length === 0 && selectedIds.length ? <div className="w-full h-full flex items-center justify-center text-indigo-400 font-bold opacity-80 pointer-events-none font-sans"><MoveRight size={20} className="mr-2 hidden sm:block"/><MoveDown size={20} className="mr-2 sm:hidden"/>放入此處</div> : (
                              <>
                                {appSettings.isMultiSelectMode && levelItems.length > 0 && (
                                  <button onClick={(e) => { e.stopPropagation(); setSelectedIds(prev => { const newIds = levelItems.map(i => i.id); return [...new Set([...prev, ...newIds])]; }); }} className="absolute bottom-1 right-1 bg-black/40 hover:bg-black/60 text-white p-1 rounded z-20" title="全選此階級"><CheckSquare size={12} /></button>
                                )}
                                {levelItems.map(renderItem)}
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* 匯出圖內嵌 QR Code */}
                  {appSettings.embedQR && getMiniQR() && (
                    <div className="absolute -bottom-2 -right-2 sm:bottom-2 sm:right-2 p-1.5 bg-white/90 rounded-lg shadow-md z-20 flex flex-col items-center gap-0.5 backdrop-blur-md border border-gray-300 scale-75 sm:scale-100 origin-bottom-right">
                      <span className="text-[8px] font-black text-gray-800 tracking-widest">SCAN ME</span>
                      <img src={getMiniQR()} alt="QR" className="w-12 h-12" crossOrigin="anonymous"/>
                    </div>
                  )}
                  
                </div>
              </div>
              <div className="p-4 sm:p-6 pt-0" style={{ backgroundColor: background.startsWith('http') ? 'transparent' : background }}>
                <button onClick={addLevel} className="w-full py-3 bg-black/40 text-gray-300 font-bold rounded-lg hover:bg-black/80 hover:text-white transition-colors flex items-center justify-center gap-2 border border-gray-600/50 backdrop-blur-sm font-sans shadow-inner z-10 relative">
                  <Plus size={18} /> 新增階級
                </button>
              </div>
            </section>
          </main>

          {/* 教學對話框 */}
          {showConfirmRestart && (
            <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm font-sans">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4"><BellRing size={32} /></div>
                <h3 className="font-bold text-xl mb-2 text-gray-900">重新觀看教學？</h3>
                <p className="text-gray-500 text-sm mb-6">這將會清除目前的版面並載入教學範例喔！</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={() => setShowConfirmRestart(false)} className="px-4 py-2 rounded-lg font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 w-full">取消</button>
                  <button onClick={startTutorial} className="px-4 py-2 rounded-lg font-bold text-white bg-yellow-500 hover:bg-yellow-600 w-full">確定</button>
                </div>
              </div>
            </div>
          )}

          {tutorial.active && (
            <div className="fixed inset-0 z-40 pointer-events-none flex flex-col justify-end sm:justify-center items-center pb-4 sm:pb-0 px-3 sm:px-4 font-sans">
              <div className="absolute inset-0 bg-black/60 transition-opacity" />
              <div className="pointer-events-auto relative z-50 bg-white rounded-2xl shadow-2xl p-5 sm:p-6 w-full max-w-sm text-center border-4 border-yellow-400 mb-2 sm:mb-0">
                <div className="flex justify-center mb-3 text-yellow-500"><Info size={36} /></div>
                {tutorial.step === 1 && (<><h3 className="text-xl font-black mb-2">歡迎來到評比製造所！</h3><p className="text-gray-600 text-sm mb-4">按 Ctrl+Z 可以復原操作喔！</p><button onClick={nextTutorialStep} className="bg-yellow-500 text-white font-black py-2 px-6 rounded-xl w-full mt-2">開始導覽</button></>)}
                {tutorial.step === 2 && (<><h3 className="text-lg font-bold mb-2">認識卡片池</h3><p className="text-gray-600 text-sm mb-4">👉 點擊發光的卡片 (按住 Ctrl 可多選)</p><button onClick={nextTutorialStep} className="text-gray-400 text-sm underline mt-2">略過</button></>)}
                {tutorial.step === 3 && (<><h3 className="text-lg font-bold mb-2">放入欄位</h3><p className="text-gray-600 text-sm mb-4">點擊發光的階級，把卡片放進去！</p><button onClick={nextTutorialStep} className="text-gray-400 text-sm underline mt-2">略過</button></>)}
                {tutorial.step === 4 && (<><h3 className="text-lg font-bold mb-2">超強擴充</h3><p className="text-gray-600 text-sm mb-4">點擊素材區「📂批次」可匯入海量圖片！</p><button onClick={nextTutorialStep} className="bg-yellow-500 text-white font-black py-2 px-6 rounded-xl w-full mt-2">瞭解了</button></>)}
                {tutorial.step === 5 && (<><h3 className="text-lg font-bold mb-2">一鍵打包 & 設定</h3><p className="text-gray-600 text-sm mb-4">點上方「專案」可調整各種全域設定！<br/>最後點「儲存大圖」即可下載！</p><button onClick={nextTutorialStep} className="bg-yellow-500 text-white font-black py-2 px-6 rounded-xl w-full mt-2">最後一步</button></>)}
                {tutorial.step === 6 && (<><h3 className="text-xl font-black mb-2 text-green-600">🎉 準備就緒！</h3><button onClick={endTutorial} className="bg-gray-900 text-white font-black py-3 px-6 rounded-xl w-full mt-4 shadow-lg">開始創造</button></>)}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 💡 渲染應用程式
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
